<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enzo Ernoux | Marketing Stratégique</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary-blue: #003d5b;
            --accent-blue: #0077b6;
            --bg-light: #f4f7f6;
            --text-dark: #333;
            --white: #ffffff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

        body { background-color: var(--bg-light); color: var(--text-dark); line-height: 1.6; }

        /* Header / Hero Section */
        header {
            height: 100vh;
            background: linear-gradient(135deg, var(--primary-blue) 0%, #001d2e 100%);
            color: var(--white);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        .profile-img {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            border: 5px solid var(--accent-blue);
            margin-bottom: 25px;
            object-fit: cover;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            opacity: 0;
            animation: fadeInUp 1s forwards;
        }

        .hero-title { 
            font-size: 3.5rem; 
            letter-spacing: 5px; 
            text-transform: uppercase; 
            margin-bottom: 10px; 
            opacity: 0; 
            transform: translateY(20px); 
            animation: fadeInUp 1s 0.3s forwards; 
        }

        .hero-subtitle { 
            font-size: 1.5rem; 
            font-style: italic; 
            font-weight: 300; 
            opacity: 0; 
            animation: fadeInUp 1s 0.6s forwards; 
        }

        /* Key Metrics Section */
        .metrics {
            display: flex;
            justify-content: space-around;
            background: var(--white);
            padding: 40px 10%;
            margin: -60px auto 0 auto;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            width: 85%;
            position: relative;
            z-index: 10;
        }

        .metric-item { text-align: center; }
        .metric-number { display: block; font-size: 2.5rem; font-weight: bold; color: var(--accent-blue); }
        .metric-label { font-size: 0.8rem; color: #666; text-transform: uppercase; letter-spacing: 1px; }

        /* Sections */
        section { padding: 80px 15%; }
        h2 { border-left: 5px solid var(--accent-blue); padding-left: 15px; margin-bottom: 40px; text-transform: uppercase; color: var(--primary-blue); font-size: 1.8rem; }

        /* Experience Timeline */
        .timeline { border-left: 2px solid var(--accent-blue); padding-left: 30px; position: relative; }
        .exp-card { background: white; padding: 30px; margin-bottom: 30px; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); position: relative; }
        .exp-card::before { content: ""; width: 16px; height: 16px; background: var(--accent-blue); position: absolute; left: -39px; top: 35px; border-radius: 50%; border: 4px solid var(--bg-light); }
        .exp-date { font-weight: bold; color: var(--accent-blue); font-size: 0.9rem; }
        .exp-company { font-style: italic; color: #555; margin-bottom: 15px; display: block; font-weight: 600; }
        
        ul { list-style-type: none; }
        li { margin-bottom: 10px; position: relative; padding-left: 25px; font-size: 0.95rem; }
        li::before { content: "→"; position: absolute; left: 0; color: var(--accent-blue); font-weight: bold; }

        /* Skills Grid */
        .skills-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 25px; }
        .skill-box { background: var(--primary-blue); color: white; padding: 30px; border-radius: 12px; transition: all 0.3s ease; }
        .skill-box:hover { transform: translateY(-10px); background: var(--accent-blue); }
        .skill-box h3 { margin-bottom: 15px; border-bottom: 1px solid rgba(255,255,255,0.2); padding-bottom: 10px; }

        /* Contact & Footer */
        footer { background: var(--primary-blue); color: white; text-align: center; padding: 80px 20px; margin-top: 50px; }
        .contact-links { margin: 30px 0; }
        .contact-links a { color: white; font-size: 2rem; margin: 0 20px; text-decoration: none; transition: 0.3s; }
        .contact-links a:hover { color: var(--accent-blue); transform: scale(1.2); display: inline-block; }

        /* Animations */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 768px) {
            .hero-title { font-size: 2.2rem; }
            .metrics { flex-direction: column; gap: 30px; width: 90%; margin-top: -30px; }
            section { padding: 60px 8%; }
        }
    </style>
</head>
